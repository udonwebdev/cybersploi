---
# CYBERSPLOI Kubernetes Deployment - Frontend
# Static SPA served via Nginx with CDN

apiVersion: v1
kind: ConfigMap
metadata:
  name: cybersploi-frontend-config
  namespace: cybersploi
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      access_log /var/log/nginx/access.log main;
      sendfile on;
      tcp_nopush on;
      keepalive_timeout 65;
      gzip on;
      gzip_comp_level 6;
      gzip_types text/plain text/css application/json application/javascript text/javascript;

      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "no-referrer-when-downgrade" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

      server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        location / {
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
        }

        location ~* ^[^\.]/.+\.(css|js)$ {
          expires 1y;
          add_header Cache-Control "public";
        }

        location /api/ {
          proxy_pass http://cybersploi-backend-service:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
          return 200 "healthy\n";
          add_header Content-Type text/plain;
        }

        location /metrics {
          return 404;
        }
      }
    }

---

apiVersion: v1
kind: Service
metadata:
  name: cybersploi-frontend-service
  namespace: cybersploi
  labels:
    app: cybersploi-frontend
spec:
  type: ClusterIP
  selector:
    app: cybersploi-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersploi-frontend
  namespace: cybersploi
  labels:
    app: cybersploi-frontend
    version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: cybersploi-frontend
  
  template:
    metadata:
      labels:
        app: cybersploi-frontend
        version: "1.0.0"
    
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
        - name: frontend
          image: docker.io/cybersploi/frontend:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          # Resource limits
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          # Volume mounts
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: nginx-config
          configMap:
            name: cybersploi-frontend-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cybersploi-frontend-pdb
  namespace: cybersploi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cybersploi-frontend

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cybersploi-frontend-hpa
  namespace: cybersploi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cybersploi-frontend
  
  minReplicas: 2
  maxReplicas: 5
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85%
