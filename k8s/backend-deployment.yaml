---
# CYBERSPLOI Kubernetes Deployment - Backend API Server
# Stateless API service with auto-scaling

apiVersion: v1
kind: ConfigMap
metadata:
  name: cybersploi-backend-config
  namespace: cybersploi
data:
  LOG_LEVEL: INFO
  DEBUG: "false"
  WORKERS: "4"
  ENVIRONMENT: production

---

apiVersion: v1
kind: Service
metadata:
  name: cybersploi-backend-service
  namespace: cybersploi
  labels:
    app: cybersploi-backend
spec:
  type: ClusterIP
  selector:
    app: cybersploi-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 8001
      targetPort: 8001
      protocol: TCP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersploi-backend
  namespace: cybersploi
  labels:
    app: cybersploi-backend
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: cybersploi-backend
  
  template:
    metadata:
      labels:
        app: cybersploi-backend
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    
    spec:
      serviceAccountName: cybersploi-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Init containers - run pre-flight checks
      initContainers:
        - name: wait-for-db
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for db; sleep 2; done;']
        
        - name: wait-for-redis
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done;']
      
      containers:
        - name: backend
          image: docker.io/cybersploi/backend:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 8001
              protocol: TCP
          
          # Environment variables
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cybersploi-backend-config
                  key: LOG_LEVEL
            
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: cybersploi-backend-config
                  key: DEBUG
            
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cybersploi-secrets
                  key: database-url
            
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cybersploi-secrets
                  key: redis-url
            
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cybersploi-secrets
                  key: secret-key
            
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cybersploi-secrets
                  key: jwt-secret
            
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          # Resource requests and limits
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          # Volume mounts
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: config
          configMap:
            name: cybersploi-backend-config
        - name: tmp
          emptyDir: {}
      
      affinity:
        # Pod anti-affinity - spread replicas across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cybersploi-backend
                topologyKey: kubernetes.io/hostname

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cybersploi-backend-hpa
  namespace: cybersploi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cybersploi-backend
  
  minReplicas: 2
  maxReplicas: 10
  
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metrics
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cybersploi-backend-pdb
  namespace: cybersploi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cybersploi-backend

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cybersploi-backend
  namespace: cybersploi

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cybersploi-backend
  namespace: cybersploi
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cybersploi-backend
  namespace: cybersploi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cybersploi-backend
subjects:
  - kind: ServiceAccount
    name: cybersploi-backend
    namespace: cybersploi
