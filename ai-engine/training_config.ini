# Training Configuration for Cyber Sploi ML Pipeline

[DATASET_GENERATION]
# Vulnerability Dataset
vulnerability_count = 1000000
vulnerability_output = "./training_data/vulnerabilities_1m.jsonl"

# Malware Dataset  
malware_count = 1000000
malware_output = "./training_data/malware_1m.jsonl"

# Threat Intelligence Dataset
threat_intel_count = 1000000
threat_intel_output = "./training_data/threat_intelligence_1m.jsonl"

# Total Records
total_records = 3000000

[DATA_PROCESSING]
# Train/validation split
train_ratio = 0.8
val_ratio = 0.2

# Random seed for reproducibility
random_seed = 42

# Feature normalization
normalize_features = true
feature_scaling = "minmax"  # minmax or standard

[MODEL_ARCHITECTURE]
# Vulnerability Classifier
vuln_layers = [64, 128, 64, 32]
vuln_dropout = [0.3, 0.3, 0.2, 0.0]
vuln_batch_norm = true
vuln_output_classes = 5

# Malware Detector
malware_layers = [128, 256, 128, 64]
malware_dropout = [0.3, 0.3, 0.2, 0.0]
malware_batch_norm = true
malware_output_classes = 5

# Threat Risk Scorer
threat_layers = [64, 128, 64, 32]
threat_dropout = [0.2, 0.2, 0.15, 0.0]
threat_batch_norm = true
threat_output_classes = 4

[TRAINING]
# Training parameters
epochs = 5
batch_size = 256
learning_rate = 0.001
weight_decay = 0.00001
optimizer = "adam"

# Learning rate scheduling
scheduler = "ReduceLROnPlateau"
scheduler_factor = 0.5
scheduler_patience = 2
scheduler_min_lr = 0.00001

# Loss function
loss_function = "CrossEntropyLoss"

# Early stopping
early_stopping = false
early_stopping_patience = 3
early_stopping_tolerance = 0.001

[VALIDATION]
# Validation during training
validation_split = 0.2
validation_frequency = 1  # Validate every N epochs

# Metrics to track
metrics = ["loss", "accuracy", "precision", "recall", "f1"]

[CHECKPOINTING]
# Model checkpointing
save_best_model = true
best_metric = "val_loss"  # Metric to monitor
save_frequency = 1  # Save every N epochs
models_dir = "./trained_models"

[HARDWARE]
# GPU configuration
use_gpu = true
gpu_device = 0  # GPU device ID
mixed_precision = false  # fp16 training

# CPU configuration
num_workers = 4  # Data loading workers
pin_memory = true

[LOGGING]
# Logging configuration
log_level = "INFO"
log_file = "./training_logs/training.log"
log_frequency = 100  # Log metrics every N batches

# Tensorboard
use_tensorboard = false
tensorboard_dir = "./logs/runs"

[INFERENCE]
# Inference configuration
model_precision = "float32"  # float32 or float16
batch_inference_size = 256
cache_size = 10000

# Performance
inference_timeout = 5.0  # seconds
max_model_load_time = 30.0  # seconds

[DATA_AUGMENTATION]
# Optional data augmentation
use_augmentation = false
augmentation_probability = 0.3

[HYPERPARAMETER_TUNING]
# Optional: Optuna hyperparameter search
use_tuning = false
tuning_trials = 50
tuning_metric = "val_accuracy"

[OUTPUT]
# Output directories
training_dir = "./training_data"
models_dir = "./trained_models"
logs_dir = "./training_logs"
reports_dir = "./reports"

# Save trained models
save_model_format = "pth"  # pth or onnx
save_model_weights = true
save_model_state = true

# Generate reports
generate_report = true
report_format = "html"  # html or pdf
include_confusion_matrix = true
include_roc_curves = true

[EVALUATION]
# Evaluation metrics
eval_metrics = ["accuracy", "precision", "recall", "f1", "auc-roc"]

# Threshold for class prediction
class_thresholds = {
    "vulnerability": 0.5,
    "malware": 0.5,
    "threat_intel": 0.5
}

# Cross-validation
use_cross_validation = false
cv_folds = 5

[CONSTRAINTS]
# Resource constraints
max_memory_gb = 16
max_training_time_hours = 12
min_accuracy_threshold = 0.75

# Dataset constraints
max_records_per_epoch = 1000000
min_records_for_training = 100000

[REPRODUCIBILITY]
# Reproducibility settings
random_seed = 42
torch_deterministic = true
torch_benchmark = false
torch_num_threads = 4

# Version tracking
track_git_commit = true
save_config_with_model = true
